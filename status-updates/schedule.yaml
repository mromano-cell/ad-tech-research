# Status Update Schedule
# This file tracks cadences, due dates, and project mappings for automated status updates.
# The /status-update skill reads this to determine reporting periods and updates it after generation.

reports:
  wrike:
    name: "Wrike Status Update"
    cadence_days: 14
    next_due: "2026-10-15"
    last_generated: "2026-10-01"
    notify_days_before: 1

  gtm:
    name: "GTM Biweekly"
    cadence_days: 14
    next_due: "2026-10-22"
    last_generated: "2026-10-07"
    notify_days_before: 1

  mbr:
    name: "Monthly Business Report"
    cadence_type: "first_wednesday"
    next_due: "2026-10-07"
    last_generated: null
    notify_days_before: 1


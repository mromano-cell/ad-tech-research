# MBR sub-topic mapping
# Used by the skill to organize the read-only MBR section by topic
mbr_topics:
  - name: "IBCC GTM Launch"
    search_terms: ["IBCC launch", "IBCC GTM", "IBCC pipeline", "IBCC opportunities"]
    include_sfdc: true
    sfdc_query: >
      SELECT Id, Name, StageName, Amount, CreatedDate, CloseDate
      FROM Opportunity
      WHERE (Name LIKE '%Custom Display%' OR Name LIKE '%Rich Media%' OR Name LIKE '%DYCA%' OR Name LIKE '%IBCC%')
      AND CreatedDate >= THIS_MONTH
      ORDER BY CreatedDate DESC

  - name: "IBCC Enablement"
    search_terms: ["IBCC enablement", "IBCC training", "seller confidence", "eLearning", "scrimmage", "office hours"]

  - name: "IBCC Tactical Sprint"
    search_terms: ["IBCC sprint", "outreach", "target accounts", "vertical", "low hanging fruit"]

  - name: "Whitepaper Development"
    search_terms: ["white paper", "whitepaper", "growth marketing", "Joe Marcus", "thought leadership"]

  - name: "IBCC Phase 2 – Search-Based Audiences"
